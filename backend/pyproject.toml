[project]
name = "wrapex-backend"
version = "0.1.0"
description = "WrapEx — Spotify Extended Streaming History Dashboard"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<5.2",
    "djangorestframework>=3.15,<4",
    "djangorestframework-simplejwt>=5.3,<6",
    "django-cors-headers>=4.6,<5",
    "celery[redis]>=5.4,<6",
    "polars>=1.18,<2",
    "boto3>=1.35,<2",
    "psycopg[binary]>=3.2,<4",
    "gunicorn>=23,<24",
    "python-decouple>=3.8,<4",
    "whitenoise>=6.8,<7",
    "stripe>=14.4.1",
    "sentry-sdk[django,celery]>=2.19,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "ruff>=0.8",
    "ipython>=8",
]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "wrapex.settings.development"
python_files = ["tests.py", "test_*.py"]
