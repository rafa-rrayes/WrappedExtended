[project]
name = "wrapex-backend"
version = "0.1.0"
description = "WrapEx — Spotify Extended Streaming History Dashboard"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<5.2",
    "djangorestframework>=3.15,<4",
    "djangorestframework-simplejwt>=5.3,<6",
    "django-cors-headers>=4.6,<5",
    "celery[redis]>=5.4,<6",
    "polars>=1.18,<2",
    "boto3>=1.35,<2",
    "psycopg[binary]>=3.2,<4",
    "gunicorn>=23,<24",
    "python-decouple>=3.8,<4",
    "whitenoise>=6.8,<7",
    "stripe>=14.4.1",
    "sentry-sdk[django,celery]>=2.19,<3",
    "scikit-learn>=1.5,<2",
    "statsmodels>=0.14,<1",
    "pandas>=2.2,<3",
    "pyarrow>=18",
]

# Deliberately NOT installed by default: torch alone is >1GB, which we refuse to
# carry in the web/worker image. `processing/ml/` degrades gracefully without them
# (the MLP and LSTM report `available: false`, UMAP falls back to t-SNE), so this
# extra exists only for a dedicated deep-learning worker: `uv sync --extra ml-deep`.
[project.optional-dependencies]
ml-deep = [
    "torch>=2.5",
    "umap-learn>=0.5",
]

# Installed by a plain `uv sync`, unlike [project.optional-dependencies] which
# needs an explicit `--extra dev`. Keeps ruff/pytest present in every dev env.
[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "ruff>=0.8",
    "ipython>=8",
]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Django generates these; reformatting them just creates migration churn.
"*/migrations/*" = ["E501", "I001"]

[tool.pytest.ini_options]
# wrapex.settings.test swaps Postgres/Redis/MinIO for in-process equivalents, so a bare
# `uv run pytest` passes with no services running. See that module for the details.
DJANGO_SETTINGS_MODULE = "wrapex.settings.test"
python_files = ["tests.py", "test_*.py"]
testpaths = ["api/tests"]
addopts = "-ra --strict-markers -m 'not slow'"
markers = [
    "slow: model fits that take seconds rather than milliseconds; excluded by default, run with `-m slow`",
]
