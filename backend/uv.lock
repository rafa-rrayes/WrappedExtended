source = { virtual = "." }
dependencies = [
    { name = "boto3" },
    { name = "celery", extra = ["redis"] },
    { name = "django" },
    { name = "django-cors-headers" },
    { name = "djangorestframework" },
    { name = "djangorestframework-simplejwt" },
    { name = "gunicorn" },
    { name = "pandas" },
    { name = "polars" },
    { name = "psycopg", extra = ["binary"] },
    { name = "pyarrow" },
    { name = "python-decouple" },
    { name = "scikit-learn" },
    { name = "sentry-sdk", extra = ["celery", "django"] },
    { name = "statsmodels" },
    { name = "stripe" },
    { name = "whitenoise" },
]

[package.optional-dependencies]
ml-deep = [
    { name = "torch" },
    { name = "umap-learn" },
]

[package.dev-dependencies]
dev = [
    { name = "ipython" },
    { name = "pytest" },
    { name = "pytest-django" },
    { name = "ruff" },
]

[package.metadata]
requires-dist = [
    { name = "boto3", specifier = ">=1.35,<2" },
    { name = "celery", extras = ["redis"], specifier = ">=5.4,<6" },
    { name = "django", specifier = ">=5.1,<5.2" },
    { name = "django-cors-headers", specifier = ">=4.6,<5" },
    { name = "djangorestframework", specifier = ">=3.15,<4" },
    { name = "djangorestframework-simplejwt", specifier = ">=5.3,<6" },
    { name = "gunicorn", specifier = ">=23,<24" },
    { name = "pandas", specifier = ">=2.2,<3" },
    { name = "polars", specifier = ">=1.18,<2" },
    { name = "psycopg", extras = ["binary"], specifier = ">=3.2,<4" },
    { name = "pyarrow", specifier = ">=18" },
    { name = "python-decouple", specifier = ">=3.8,<4" },
    { name = "scikit-learn", specifier = ">=1.5,<2" },
    { name = "sentry-sdk", extras = ["django", "celery"], specifier = ">=2.19,<3" },
    { name = "statsmodels", specifier = ">=0.14,<1" },
    { name = "stripe", specifier = ">=14.4.1" },
    { name = "torch", marker = "extra == 'ml-deep'", specifier = ">=2.5" },
    { name = "umap-learn", marker = "extra == 'ml-deep'", specifier = ">=0.5" },
    { name = "whitenoise", specifier = ">=6.8,<7" },
]
provides-extras = ["ml-deep"]

[package.metadata.requires-dev]
dev = [
    { name = "ipython", specifier = ">=8" },
    { name = "pytest", specifier = ">=8" },
    { name = "pytest-django", specifier = ">=4.9" },
    { name = "ruff", specifier = ">=0.8" },
]
